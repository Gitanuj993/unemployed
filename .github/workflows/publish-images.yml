# Builds and pushes the backend/web/init images to GHCR (free for public
# repos), so end users pull prebuilt images instead of building on their own
# machine, then builds install.exe (installer/build-exe.ps1) and attaches it
# to the GitHub Release for that tag. Runs on every push of a version tag.
name: Publish images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./web
          - name: init
            context: ./backend/init
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner/name (GHCR requires it)
        id: repo
        run: echo "path=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.path }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  installer:
    # Only makes sense once the images it points to actually exist.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build install.exe
        shell: pwsh
        run: ./installer/build-exe.ps1

      - name: Attach install.exe to the release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/install.exe
