# Two ways to run this, and the profile decides which:
#
#   docker compose up -d                  # Postgres only — development
#   docker compose --profile app up -d    # the full stack, nothing on the host
#
# Development runs the backend and frontend on the host for hot reload, against
# a natively installed Ollama (`ollama pull llama3.2:3b`). So the bare `up -d`
# starts *only* Postgres — pulling a second, containerised copy of the same 2 GB
# model would be pure waste. `ollama`, `init`, `api`, `web` and `worker` are all
# in the `app` profile, which is the self-contained path that needs no host
# Python, Node or Ollama at all.
#
services:
  postgres:
    # pgvector/pgvector ships Postgres with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg16
    container_name: jobsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: jobsearch
      POSTGRES_DB: jobsearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch -d jobsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    profiles: ["app"]
    # Local LLM runtime for the full-stack path. Development uses a native
    # Ollama install on the host instead, so this stays off by default.
    image: ollama/ollama:latest
    container_name: jobsearch-ollama
    restart: unless-stopped
    ports:
      # Host port 11435 on purpose: a native Windows/macOS Ollama install owns
      # 11434 and auto-starts, which would silently shadow this container.
      - "11435:11434"
    volumes:
      - ollamadata:/root/.ollama

  init:
    profiles: ["app"]
    # Pulls the Ollama model with progress and exits. Nothing blocks on it —
    # api/web start immediately and the model finishes downloading in parallel.
    build: ./backend/init
    container_name: jobsearch-init
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}

  api:
    profiles: ["app"]
    build: ./backend
    container_name: jobsearch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network, services reach each other by name — and
      # ollama listens on its own 11434 here, not the 11435 host mapping.
      DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch@postgres:5432/jobsearch
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"
    volumes:
      - generated:/app/generated
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    profiles: ["app"]
    build: ./backend
    container_name: jobsearch-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch@postgres:5432/jobsearch
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    # Ingest + score once a day. The API applies migrations, so the worker waits.
    command: python -m app.worker.scheduler --daily

  web:
    profiles: ["app"]
    build: ./web
    container_name: jobsearch-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  # Named explicitly, matching the fixed container_names above: compose
  # otherwise prefixes volume names with the *directory* name, so two clones
  # of this repo in differently-named folders get two different, disconnected
  # volumes while sharing the same container name. Recreating the container
  # from the "wrong" folder then silently attaches a fresh empty database
  # under a name that looks identical to the one holding real data - which is
  # exactly what happened once already. Pinning the name makes the volume as
  # global as the container, so any clone on this machine always reattaches
  # the same data.
  pgdata:
    name: jobsearch_pgdata
  ollamadata:
    name: jobsearch_ollamadata
  generated:
    name: jobsearch_generated
